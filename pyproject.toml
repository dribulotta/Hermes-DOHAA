[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-dohaa"
version = "0.1.0a1"
description = "Evidence-gated governance and bounded self-improvement for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Dante Guillermo Ribulotta" },
]
keywords = ["agents", "governance", "evidence", "hermes", "dohaa"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dribulotta/Hermes-DOHAA"
Issues = "https://github.com/dribulotta/Hermes-DOHAA/issues"

[project.scripts]
hermes-dohaa = "hermes_dohaa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
