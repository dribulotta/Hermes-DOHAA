name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Validate public development checks
        run: python tools/check_project.py --output .dohaa/validation/ci
      - name: Retain validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: .dohaa/validation/ci/
          retention-days: 14
          if-no-files-found: error
